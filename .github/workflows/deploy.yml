name: Deploy

# Runs after CI succeeds on main (or manually). Builds the sunbur image,
# pushes it to GHCR, then rolls it out on the k3s cluster.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-sunbur
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          # KUBE_CONFIG may be either the raw kubeconfig YAML or its base64 encoding
          if echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config 2>/dev/null && grep -q "apiVersion" ~/.kube/config; then
            echo "KUBE_CONFIG decoded from base64"
          else
            echo "$KUBE_CONFIG" > ~/.kube/config
            echo "KUBE_CONFIG used as raw YAML"
          fi
          chmod 600 ~/.kube/config

      - name: Roll out new image on k3s
        run: |
          kubectl set image deployment/sunbur sunbur=ghcr.io/sunburdev/sunbur:${{ needs.build-and-push.outputs.sha }} -n sunbur
          kubectl rollout status deployment/sunbur -n sunbur --timeout=120s
